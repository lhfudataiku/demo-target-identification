<!--
  Mockup iteration 2. Specified in DASHBOARD_DESIGN.md section 12.
  Iteration 1 is kept alongside at DASHBOARD_MOCKUP.html — do not overwrite it.

  WHAT CHANGED FROM ITERATION 1
    - Acts 5 and 6 left the webapp (section 12.1). Four acts here; their content is
      summarised in the "Not in the app" section as a talk track with the card-to-act
      mapping, because that is what they are now for.
    - Every chart is specified against a small pre-aggregated dataset, not the raw
      one (section 12.2). The provenance footers are links.
    - Act 1: node sources added, node types moved left, graph explorer embedded,
      frozen-reference table dropped, "6 external sources" replaces it.
    - Act 2: Sankey over pool routes and splits; AUC cards merged behind a tab;
      SHAP-driver importance added; the enrichment box plot now carries all 668
      diseases as a beeswarm with hover labels; AUPRC stated against base rate.
    - Act 3: family dropdown, ontology tree, AUC as confidence intervals rather
      than points, overlap matrix and gene-by-disease grid.
    - Act 4: disease selector, filterable list, gene selection drives the last two
      cards, and the liability toggle imported from act 6.
    - Four numbers corrected — see section 12.11. The degree-matched figure moved
      to the talk track with its guarded value (3.29x pooled, not 2.9x).

  DATA
    Everything marked LIVE was computed from the DSS datasets on 2026-08-21.
    The 668-disease enrichment array, the 66-pair overlap matrix and the 119-gene
    membership grid are real values, not shapes.
    Values marked MOCK are illustrative and exist to show a layout: currently only
    the per-gene feature percentiles in act 4.

  DESIGN SYSTEM — inherited from bs-blueprint/frontend/src/styles/tokens.css.
    Primary is the Dataiku indigo hsl(233.92 50% 35%); neutrals carry the
    blueprint's blue bias (hue 240); series colours are --chart-1..5; type is the
    Tailwind default sans stack, the same faces the Vue app will render.
-->

/* ==========================================================================
   Helpers
   ========================================================================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');
const DSS = 'https://design.solutions.dataiku-dss.io/projects/DEMO_TARGET_IDENTIFICATION';
const dsLink = n => `<a href="${DSS}/datasets/${n}/explore/" target="_blank" rel="noopener">${n}</a>`;
const rcLink = n => `<a href="${DSS}/recipes/${n}/" target="_blank" rel="noopener">${n}</a>`;

function hbars(rows, o = {}) {
  const rh = o.rowH || 20, gap = 4, lw = o.labelW || 168, vw = 62;
  const h = rows.length * (rh + gap), max = Math.max(...rows.map(r => r[1]));
  const bw = Math.max(110, (o.width || 640) - lw - vw);
  let s = `<svg viewBox="0 0 ${lw + bw + vw} ${h}" role="img" aria-label="${esc(o.aria || 'bar chart')}">`;
  rows.forEach((r, i) => {
    const y = i * (rh + gap), w = Math.max(1.5, (r[1] / max) * bw);
    s += `<text class="lab" x="${lw - 8}" y="${y + rh / 2 + 4}" font-size="11" text-anchor="end">${esc(r[0])}</text>`
      +  `<rect x="${lw}" y="${y + 2}" width="${w}" height="${rh - 4}" rx="2.5" fill="${r[2] || 'var(--chart-3)'}"/>`
      +  `<text x="${lw + bw + vw - 2}" y="${y + rh / 2 + 4}" font-size="10.5" text-anchor="end">${fmt(r[1])}</text>`;
  });
  return s + '</svg>';
}

function histogram(bins, o = {}) {
  const W = 640, H = o.height || 190, pl = 34, pb = 26, pt = 10, pr = 8;
  const iw = W - pl - pr, ih = H - pb - pt, max = Math.max(...bins), bw = iw / bins.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'histogram')}">`;
  for (let g = 0; g <= 4; g++) {
    const y = pt + ih - ih * g / 4;
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>`
      +  `<text x="${pl - 6}" y="${y + 3.5}" font-size="9.5" text-anchor="end">${Math.round(max * g / 4)}</text>`;
  }
  bins.forEach((c, i) => {
    if (!c) return;
    const bh = (c / max) * ih, mid = (i + .5) / bins.length;
    s += `<rect x="${pl + i * bw + 1}" y="${pt + ih - bh}" width="${bw - 2}" height="${bh}" rx="1.5"
           fill="${mid < .5 ? 'var(--chart-1)' : 'var(--chart-3)'}"/>`;
  });
  const ch = pl + .5 * iw;
  s += `<line x1="${ch}" x2="${ch}" y1="${pt}" y2="${pt + ih}" stroke="var(--muted-foreground)" stroke-dasharray="2 3"/>`
    +  `<text x="${ch - 4}" y="${pt + 11}" font-size="9" text-anchor="end">chance</text>`;
  if (o.mean != null) {
    const x = pl + o.mean * iw;
    s += `<line x1="${x}" x2="${x}" y1="${pt}" y2="${pt + ih}" stroke="var(--destructive)" stroke-width="1.5"/>`
      +  `<text x="${x + 4}" y="${pt + 11}" font-size="10" fill="var(--destructive)">macro ${o.mean.toFixed(4)}</text>`;
  }
  if (o.marker != null) {
    const x = pl + o.marker * iw;
    s += `<path d="M${x} ${pt + ih} l-4 8 h8 z" fill="var(--primary)"/>`
      +  `<text x="${x}" y="${pt + ih + 22}" font-size="10" text-anchor="middle" fill="var(--primary)">${esc(o.markerLabel || '')}</text>`;
  }
  s += `<line x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}" stroke="var(--border)"/>`;
  [0,.25,.5,.75,1].forEach(t => s += `<text x="${pl + t * iw}" y="${H - 6}" font-size="9.5" text-anchor="middle">${t.toFixed(2)}</text>`);
  return s + '</svg>';
}

/** Sankey: routes -> pool -> splits. Routes overlap, so the join is drawn as a
 *  convergence onto the UNION node and the removed duplication is labelled. */
function sankey(p) {
  const W = 780, H = 250, pad = 14, lw = 132, midX = 330, midW = 26, rightX = 560;
  const rawSum = p.routes.reduce((a, b) => a + b[1], 0);
  const scale = (H - pad * 2 - 24) / Math.max(rawSum, p.union);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="candidate pool routes and splits">`;
  let y = pad, midY = pad, ribbons = '';
  const midH = p.union * scale;
  p.routes.forEach((r, i) => {
    const h = r[1] * scale, col = ['var(--chart-3)','var(--chart-2)','var(--chart-1)'][i];
    s += `<text class="lab" x="${lw - 16}" y="${y + h / 2 - 1}" font-size="10.5" text-anchor="end" fill="var(--foreground)">${esc(r[0])}</text>`
      +  `<text x="${lw - 16}" y="${y + h / 2 + 11}" font-size="10" text-anchor="end">${fmt(r[1])}</text>`
      +  `<rect x="${lw - 10}" y="${y}" width="10" height="${Math.max(1.5, h)}" rx="2" fill="${col}"/>`;
    const th = h * (p.union / rawSum);
    ribbons += `<path d="M${lw} ${y} C${midX - 80} ${y}, ${midX - 80} ${midY}, ${midX} ${midY}
                 L${midX} ${midY + th} C${midX - 80} ${midY + th}, ${midX - 80} ${y + h}, ${lw} ${y + h} Z"
                 fill="${col}" fill-opacity=".26"/>`;
    y += h + 8; midY += th;
  });
  s = s.replace('>', '>' + ribbons);
  s += `<rect x="${midX}" y="${pad}" width="${midW}" height="${midH}" rx="3" fill="var(--primary)"/>`
    +  `<text class="lab" x="${midX + midW / 2}" y="${pad - 4}" font-size="10.5" text-anchor="middle" fill="var(--foreground)">candidate pool</text>`
    +  `<text x="${midX + midW / 2}" y="${pad + midH / 2}" font-size="11" text-anchor="middle" fill="var(--primary-foreground)">${fmt(p.union)}</text>`
    +  `<text x="${midX + midW / 2}" y="${pad + midH / 2 + 13}" font-size="9" text-anchor="middle" fill="var(--primary-foreground)">${p.posRate}% positive</text>`;
  let ry = pad;
  p.splits.forEach((r, i) => {
    const h = r[1] * scale, col = ['var(--chart-3)','var(--chart-2)','var(--chart-1)'][i];
    s += `<path d="M${midX + midW} ${ry} C${rightX - 90} ${ry}, ${rightX - 90} ${ry}, ${rightX} ${ry}
           L${rightX} ${ry + h} C${rightX - 90} ${ry + h}, ${rightX - 90} ${ry + h}, ${midX + midW} ${ry + h} Z"
           fill="${col}" fill-opacity=".26"/>`
      +  `<rect x="${rightX}" y="${ry}" width="10" height="${Math.max(1.5, h)}" rx="2" fill="${col}"/>`
      +  `<text class="lab" x="${rightX + 16}" y="${ry + h / 2 - 2}" font-size="10.5" fill="var(--foreground)">${esc(r[0])}</text>`
      +  `<text x="${rightX + 16}" y="${ry + h / 2 + 10}" font-size="10">${fmt(r[1])}</text>`;
    ry += h;
  });
  s += `<text x="${midX + midW / 2}" y="${H - 6}" font-size="9.5" text-anchor="middle">`
    +  `routes overlap — ${fmt(rawSum - p.union)} duplicate admissions removed</text>`;
  return s + '</svg>';
}

/** Box plot with every observation as a jittered dot underneath. */
function beeswarm(box, pts, o = {}) {
  const W = 700, H = 168, pl = 14, pr = 14, by = 16, bh = 26, sy = 62, sh = 78;
  const hi = Math.ceil(box.max / 10) * 10, iw = W - pl - pr, X = v => pl + (v / hi) * iw;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="rank enrichment across 668 diseases">`;
  s += `<line x1="${X(box.min)}" x2="${X(box.max)}" y1="${by + bh / 2}" y2="${by + bh / 2}" stroke="var(--chart-3)" stroke-width="1.5"/>`;
  [box.min, box.max].forEach(v => s += `<line x1="${X(v)}" x2="${X(v)}" y1="${by + 5}" y2="${by + bh - 5}" stroke="var(--chart-3)" stroke-width="1.5"/>`);
  s += `<rect x="${X(box.q1)}" y="${by}" width="${X(box.q3) - X(box.q1)}" height="${bh}" rx="3"
         fill="color-mix(in oklab, var(--chart-3) 20%, transparent)" stroke="var(--chart-3)"/>`
    +  `<line x1="${X(box.med)}" x2="${X(box.med)}" y1="${by - 3}" y2="${by + bh + 3}" stroke="var(--chart-3)" stroke-width="2.5"/>`
    +  `<text x="${X(box.med)}" y="${by - 8}" font-size="11" text-anchor="middle" fill="var(--chart-3)">median ${box.med.toFixed(1)}×</text>`;
  /* 668 dots as ONE path, not 668 elements with 668 <title> children — that shape
     costs ~1,300 DOM nodes and visibly stalls a render. Hover is served instead by
     a nearest-point lookup over BEE_PTS, which the caller stores. */
  const named = o.named || {};
  let d = '', hits = '';
  o.hover = [];
  pts.forEach((p, i) => {
    const jitter = ((i * 2654435761) % 1000) / 1000;
    const cy = sy + 5 + jitter * (sh - 12), cx = X(p[0]);
    if (named[p[1]]) {
      hits += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="var(--primary)"/>`;
    } else {
      d += `M${cx.toFixed(1)} ${cy.toFixed(1)}m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0`;
    }
    o.hover.push([cx, cy, p[1], p[0]]);
  });
  s += `<path d="${d}" fill="var(--chart-3)" fill-opacity=".28"/>${hits}`;
  Object.keys(o.named || {}).forEach(nm => {
    const p = pts.find(x => x[1] === nm); if (!p) return;
    s += `<text class="lab" x="${X(p[0])}" y="${sy}" font-size="9.5" text-anchor="middle" fill="var(--primary)">${esc(o.named[nm])}</text>`;
  });
  for (let v = 0; v <= hi; v += 10) s += `<text x="${X(v)}" y="${H - 4}" font-size="9.5" text-anchor="middle">${v}×</text>`;
  s += `<text id="beeTip" x="0" y="0" font-size="10" fill="var(--primary)" text-anchor="middle" visibility="hidden"></text>`;
  s += `<rect x="0" y="${sy}" width="${W}" height="${sh}" fill="transparent" id="beeHit"/>`;
  return s + '</svg>';
}

/** Nearest-point hover for the beeswarm — one listener, no per-dot DOM. */
function wireBeeswarm(root, pts, W) {
  const hit = root.querySelector('#beeHit'), tip = root.querySelector('#beeTip');
  if (!hit) return;
  const svg = hit.ownerSVGElement;
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
    const sy2 = (ev.clientY - r.top) / r.height * (svg.viewBox.baseVal.height);
    let best = null, bd = 1e9;
    for (const p of pts) { const dx = p[0] - sx, dy = p[1] - sy2, dd = dx * dx + dy * dy;
      if (dd < bd) { bd = dd; best = p; } }
    if (best && bd < 90) {
      tip.textContent = `${best[2]} — ${best[3].toFixed(1)}×`;
      tip.setAttribute('x', Math.min(Math.max(best[0], 90), W - 90));
      tip.setAttribute('y', best[1] - 8);
      tip.setAttribute('visibility', 'visible');
    } else tip.setAttribute('visibility', 'hidden');
  });
  hit.addEventListener('mouseleave', () => tip.setAttribute('visibility', 'hidden'));
}

/** Horizontal confidence intervals — the honest form for per-disease AUC. */
function intervals(rows) {
  const W = 660, rh = 24, pl = 118, pr = 78, H = rows.length * rh + 26;
  const lo = 0.6, hi = 1.06, iw = W - pl - pr, X = v => pl + ((v - lo) / (hi - lo)) * iw;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="per-disease AUC with 95% confidence intervals">`;
  const one = X(1.0);
  s += `<line x1="${one}" x2="${one}" y1="6" y2="${H - 20}" stroke="var(--destructive)" stroke-dasharray="3 3"/>`
    +  `<text x="${one + 4}" y="${H - 22}" font-size="9" fill="var(--destructive)">AUC = 1.0, the ceiling</text>`;
  rows.forEach((r, i) => {
    const y = 10 + i * rh + rh / 2, ok = r[10];
    const col = ok ? 'var(--chart-3)' : 'var(--destructive)';
    const over = r[7] > 1.0;
    s += `<text class="lab" x="${pl - 8}" y="${y + 3.5}" font-size="11" text-anchor="end"
           fill="${ok ? 'var(--muted-foreground)' : 'var(--destructive)'}">${esc(r[0])}</text>`
      +  `<line x1="${X(r[6])}" x2="${X(Math.min(r[7], hi))}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="1.5"/>`
      +  `<line x1="${X(r[6])}" x2="${X(r[6])}" y1="${y - 4}" y2="${y + 4}" stroke="${col}" stroke-width="1.5"/>`
      +  (over ? `<path d="M${X(hi)} ${y - 5} l7 5 -7 5 Z" fill="${col}"/>`
               : `<line x1="${X(r[7])}" x2="${X(r[7])}" y1="${y - 4}" y2="${y + 4}" stroke="${col}" stroke-width="1.5"/>`)
      +  `<circle cx="${X(r[5])}" cy="${y}" r="3.4" fill="${col}"/>`
      +  `<text x="${W - 4}" y="${y + 3.5}" font-size="9.5" text-anchor="end"
           fill="${ok ? 'var(--muted-foreground)' : 'var(--destructive)'}">n=${r[4]}${over ? '  hi ' + r[7].toFixed(3) : ''}</text>`;
  });
  [0.6,0.7,0.8,0.9,1.0].forEach(t => s += `<text x="${X(t)}" y="${H - 4}" font-size="9.5" text-anchor="middle">${t.toFixed(1)}</text>`);
  return s + '</svg>';
}

/** Symmetric pairwise overlap matrix. */
function matrix(labels, pairs, mode) {
  const n = labels.length, cell = 26, pl = 104, pt = 74, W = pl + n * cell + 46, H = pt + n * cell + 12;
  const lookup = {};
  pairs.forEach(p => { lookup[p[0] + '|' + p[1]] = mode === 'novel' ? p[3] : p[2];
                       lookup[p[1] + '|' + p[0]] = mode === 'novel' ? p[3] : p[2]; });
  const vals = Object.values(lookup), max = Math.max(...vals, 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="pairwise top-50 overlap">`;
  labels.forEach((l, j) => s += `<text class="lab" x="${pl + j * cell + cell / 2}" y="${pt - 8}" font-size="9.5"
      text-anchor="start" transform="rotate(-52 ${pl + j * cell + cell / 2} ${pt - 8})">${esc(l)}</text>`);
  labels.forEach((a, i) => {
    s += `<text class="lab" x="${pl - 7}" y="${pt + i * cell + cell / 2 + 3.5}" font-size="10.5" text-anchor="end">${esc(a)}</text>`;
    labels.forEach((b, j) => {
      const x = pl + j * cell, y = pt + i * cell;
      if (i === j) { s += `<rect x="${x + 1}" y="${y + 1}" width="${cell - 2}" height="${cell - 2}" rx="2" fill="var(--muted)"/>`; return; }
      const v = lookup[a + '|' + b] ?? 0, t = v / max;
      s += `<rect x="${x + 1}" y="${y + 1}" width="${cell - 2}" height="${cell - 2}" rx="2"
             fill="var(--chart-3)" fill-opacity="${(0.08 + t * 0.9).toFixed(3)}"><title>${esc(a)} × ${esc(b)}: ${v} of 50</title></rect>`
        +  `<text x="${x + cell / 2}" y="${y + cell / 2 + 3.5}" font-size="9.5" text-anchor="middle"
             fill="${t > .55 ? 'var(--primary-foreground)' : 'var(--muted-foreground)'}">${v}</text>`;
    });
  });
  return s + '</svg>';
}

/** Gene x disease membership grid — the common programme vs subtype-specific split. */
function geneGrid(rows, cols) {
  const perCol = 30, groups = [];
  for (let i = 0; i < rows.length; i += perCol) groups.push(rows.slice(i, i + perCol));
  const gw = 190, cell = 15, lw = 86, H = 26 + perCol * cell, W = groups.length * gw;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="top-50 gene membership across breast subtypes">`;
  groups.forEach((g, gi) => {
    const ox = gi * gw;
    cols.forEach((c, j) => s += `<text class="lab" x="${ox + lw + j * cell + cell / 2}" y="16" font-size="8.5"
        text-anchor="start" transform="rotate(-60 ${ox + lw + j * cell + cell / 2} 16)">${esc(c)}</text>`);
    g.forEach((r, i) => {
      const y = 26 + i * cell;
      const shared = r[1] >= 3;
      s += `<text class="lab" x="${ox + lw - 6}" y="${y + cell / 2 + 3}" font-size="9" text-anchor="end"
             fill="${shared ? 'var(--muted-foreground)' : 'var(--chart-1)'}">${esc(r[0])}</text>`;
      cols.forEach((c, j) => {
        const rank = r[2 + j];
        if (!rank) return;
        const x = ox + lw + j * cell + cell / 2;
        s += `<circle cx="${x}" cy="${y + cell / 2}" r="${rank <= 10 ? 5 : rank <= 25 ? 4 : 3}"
               fill="${shared ? 'var(--chart-3)' : 'var(--chart-1)'}" fill-opacity="${rank <= 10 ? .95 : rank <= 25 ? .7 : .45}"
               ><title>${esc(r[0])} — ${esc(c)} rank ${rank}</title></circle>`;
      });
    });
  });
  return s + '</svg>';
}

/* ==========================================================================
   Card scaffolding
   ========================================================================== */
function card(o) {
  const chips = (o.chips || []).map(c => `<span class="chip chip-${c[0]}">${esc(c[1])}</span>`).join('');
  const src = (o.src || []).map((x, i) => (i ? '<span class="sep">·</span>' : '') + x).join(' ');
  return `<section class="card ${o.span || ''}" ${o.id ? `id="${o.id}"` : ''}>
    <div class="card-h"><div><div class="card-t">${o.title}</div>${o.desc ? `<div class="card-d">${o.desc}</div>` : ''}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${chips}</div></div>
    <div class="card-b">${o.body}</div>
    ${o.src ? `<div class="card-f"><span>src</span>${src}</div>` : ''}</section>`;
}
const stat = (l, v, c) => `<div class="stat"><div class="stat-l">${l}</div><div class="stat-v">${v}</div>${c ? `<div class="stat-c">${c}</div>` : ''}</div>`;
const legend = items => `<div class="lgd">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
const never = h => `<div class="no"><div class="no-t">Must not appear</div>${h}</div>`;

    chips: [['live','live']],
    body: `<div class="filters"><span class="seg" id="ovSeg">
        <button aria-selected="true" data-m="all">All top-50 genes</button>
        <button aria-selected="false" data-m="novel">Novel only</button>
      </span></div><div id="ovBody"></div>
      <div class="warnbox" style="margin-top:10px"><b>Be precise about which number you are quoting.</b>
        HER2+ and triple-negative share <b>2 of 50</b> on the novel sub-list but <b>14 of 50</b> across all
        ranked genes. The “2 of 50” claim is the novel one — say so.</div>`,
    src: [dsLink('breast_panel_overlap')] })}

  ${card({ span: 'c6', title: 'The common programme, and what is subtype-specific',
    desc: 'Every gene in the union of the four clinical subtypes’ top 50. Dot size is rank band.',
    chips: [['gap','needs recipe F']],
    body: `<div id="gridBody"></div>`
      + legend([['var(--chart-3)','in 3 or 4 subtypes — the shared breast programme'],
                ['var(--chart-1)','in one subtype only — subtype-specific']])
      + `<div class="say">119 genes in the union. <b>24 appear in three or more subtypes</b> — ATM, BRCA2,
         EP300, ESR1, FGFR1, HRAS, KRAS and the rest of the common programme. And the specificity is not
         even: <b>TNBC contributes 29 genes nobody else has; HER2+ contributes 9.</b> That is the
         quantitative version of “triple-negative is the only genuinely subtype-specific list.”</div>`,
    src: [dsLink('breast_panel_metrics'), dsLink('dashboard_candidates')] })}

  ${card({ span: 'card', title: 'What this act must not do',
    body: never(`<ul class="tight">
      <li><b>Never present triple-negative as a win.</b> Eight known associations. Read
        <code>BREAST_SURGEON_BRIEFING.md</code> before this goes near a clinician.</li>
      <li><b>Never call a subtype list “validated”.</b> This act shows coherence, and coherence is not validation.</li>
      <li><b>Do not quote an overlap number without saying which sub-list it is on.</b> 2 of 50 and 14 of 50
        are both true and they are not the same claim.</li>
    </ul>`) })}
  `,
});

ACTS.push({ id: 'shortlist', n: 4, title: 'The shortlist',
  q: 'Show me the list.',
  lede: 'One disease, all the way down. The point is not that the model is right — it is that you can argue with it on your own thresholds, then see the mechanism on the graph.',
  render: () => `
  ${card({ span: 'card', title: 'The contract',
    desc: 'A ranked shortlist of candidate targets, each carrying two independent explanations — a SHAP attribution and a graph path to the disease module.',
    chips: [['live','live']],
    body: `<div class="filters">
        <select id="disSel">${D.panel.filter(p => p[4] >= 30).map(p =>
          `<option value="${p[0]}"${p[0] === 'HER2+' ? ' selected' : ''}>${esc(p[1])} — ${fmt(p[3])} candidates</option>`).join('')}</select>
        <span style="font-size:12px;color:var(--muted-foreground)">only diseases with a materialised candidate list are offered</span>
      </div>
      <div class="stats">
        ${stat('Candidates scored','12,272','nothing pre-cut; you filter')}
        ${stat('Known targets','599','the answer key, available to delete')}

        ${stat('ERBB2 lands at','#14','never told the disease’s name')}

        <b>not</b> predict therapeutic relevance (r = +0.002).</div>`)}`,

  ${card({ span: 'c7', title: 'The ranked list',
    desc: 'Filter by attribute. <b>Click a row</b> and the two cards below follow it.',
    chips: [['live','live']],
    body: `<div class="filters" id="tblFilters">
        <button class="ctl" data-f="all" aria-selected="true">All 15</button>
        <button class="ctl" data-f="novel" aria-selected="false">Novel only</button>
        <button class="ctl" data-f="trial" aria-selected="false">In trials</button>

          Apply a safety-liability filter</label>

      <div class="tw"><table><thead><tr><th class="n">Rank</th><th>Gene</th><th>Class</th><th>Status</th></tr></thead>
        <tbody id="tblBody"></tbody></table></div>
      <div id="liabNote"></div>`,
    src: [dsLink('dashboard_candidates')] })}

  ${card({ span: 'c5', title: 'Your thresholds, not ours',
    desc: 'Three clauses, each measured at 1.42–1.71× enrichment with 98–100% recall.',
    chips: [['live','live'],['port','existing webapp']],
    body: `<div class="funnel">${D.funnel.map((f, i) => {
        const pct = (f[1] / D.funnel[0][1]) * 100, last = i === D.funnel.length - 1;
        return `<div class="fstep ${last ? 'last' : ''}">
          <div class="frow"><span class="fl">${esc(f[0])}</span><span class="fv">${fmt(f[1])}</span></div>
          <div class="fbar"><i style="width:${Math.max(pct, 0.4).toFixed(2)}%"></i></div></div>`;
      }).join('')}</div>
      <div class="say"><b>Thirty-eight is a shortlist a team clears in a week.</b> Always say the rank
        cut-off in the same breath as the count — that is how the obesity version of this figure ended up
        with two conflicting values in our own documents.</div>
      <div class="warnbox" style="margin-top:10px"><b>Sankey variant still to prototype.</b> The last stage
        is 0.3% of the first, which renders as an invisible ribbon. The proportional connectors above are
        the cheaper reading; build both before choosing.</div>`,
    src: [dsLink('dashboard_candidates'), dsLink('filter_three_axes')] })}

  ${card({ span: 'c6', id: 'drawerCard', title: 'Why this gene?', chips: [['mock','values illustrative'],['port','existing webapp']],
    desc: 'Each feature placed against <i>this disease’s</i> own distribution, not a global one.',

  ${card({ span: 'c6', id: 'graphCard', title: 'The mechanism, on the graph',
    desc: 'The selected gene, its interaction evidence, and the disease’s own annotated genes — one connected module.',

    body: `<div id="graphBody"></div>`, src: ['Kuzu folder', 'webapp wBcApLN'] })}

/* ---------- not in the app ---------- */
const TALK = { id: 'talk-track', title: 'Acts 5 & 6 — talk track',
  q: 'The interrogation and the close — deliberately not in the app.',
  lede: 'These two acts are argument, not exploration: no interaction, no per-disease state, and they owned five of the nine flow gaps. They become a talk track and a figure set generated from the notebooks. Each card below defends an act that IS in the app.',
  render: () => `
  ${card({ span: 'c8', title: 'How each card links back',
    desc: 'This mapping is the reason they can leave the app without losing the argument.',
    body: `<div class="tw"><table><thead><tr><th>Card</th><th>Defends</th><th>The line to say</th></tr></thead><tbody>
      ${[['Degree-matched enrichment','Act 4 — the shortlist','“the list you just filtered isn’t merely well-connected genes”'],
         ['Hub-bias meter','Act 2 — calibration','“and here is the population where we still under-score”'],
         ['Delete the answer key','Act 4 — the top 15','“HRAS at #9 was novel; here is what that is worth at scale”'],
         ['Lift vs K','Act 3 — the panel','“per-disease lift is what act 3’s enrichment column measured”'],
         ['Ground-truth provenance','Act 1 — the label evidence chart','“act 1 said 53% genetic association; here is why the rest is weaker”'],
         ['Orthogonality, r = +0.002','Act 2 — the AUC spread','“a high AUC in act 2 does not buy therapeutic relevance”'],
         ['The three refuted gates','Acts 1 and 4','“the annotations you filtered on are deliberately not model inputs”'],
         ['The 0.9354 lookup table','Act 2','“this is why act 2 led with a distribution and not a score”']]
        .map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td style="color:var(--muted-foreground)">${esc(r[2])}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="say"><b>One beat stayed in the app.</b> The ten-second check — nine of the HER2+ top 15
        carry a liability flag, including ERBB2 — is now the toggle in act 4. It is far stronger live than
        on a slide, and it cost nothing because the column was already loaded.</div>` })}

  ${card({ span: 'c4', title: 'Act 5, card 1 — how it is calculated',
    desc: 'Asked directly, and worth writing down because the mockup previously stated it wrong.',
    chips: [['live','live']],
    body: `<div style="font-size:12.5px">
      <p style="margin:0 0 8px">Take the <b>novel-only sub-list</b> — measured after the known targets are
        deleted, which iteration 1 did not say. For each disease and cut-off K, count how many of the top K
        are tractable (<code>obs</code>), then compare against two expectations:</p>
      <ul class="tight" style="margin-top:0">
        <li><code>naive</code> — sample K genes uniformly from that disease’s pool</li>
        <li><code>dm</code> — sample K genes <b>matched on network degree</b></li>
      </ul>
      <p style="margin:8px 0 0">Enrichment is <code>obs / expected</code>, reported pooled as
        <code>Σobs / Σexp</code>.</p></div>
      <div class="warnbox" style="margin-top:10px"><b>Correction.</b> Iteration 1 showed <b>2.9×</b> at
        top-10. That matches no guarded assertion. The real values are <b>3.29× pooled</b> and
        <b>3.11× macro</b> at K=10, and <b>2.42× pooled</b> at K=200.</div>
      <div class="say">The finding is the <b>crossover</b>, not the level: the degree control makes the
        result look <b>worse</b> at K=10 and <b>better</b> from K=20–50 onward. Volunteering that is the

    src: [dsLink('tractability_axis'), 'nb4 §8.4'] })}

/* ==========================================================================
   Interactivity
   ========================================================================== */
const SHORTS = D.panel.map(p => p[0]);
const CLIN = ['HER2+','Luminal A','Luminal B','TNBC'];
let BEE_OPTS, BEE = { hover: [] };
let sel = { gene: 'HRAS', auc: 'disease', ov: 'all', filter: 'all', liab: false };

/* MOCK: per-disease feature percentiles. Shape is right; values are illustrative
   until the backend computes them per gene (the existing webapp already does). */
const FEAT = {
  HRAS:   [96, 91, 88, 74, 62], ERBB2: [99, 97, 94, 89, 81], TP53: [99, 98, 97, 92, 88],
  PIK3CA: [97, 95, 91, 86, 79], EGFR:  [95, 93, 90, 84, 77],
};
const FEATL = ['Gene–gene–disease path weight','Random-walk proximity to the module',
               'Shared interaction partners','Closest hop to a module gene','Shared pathways with the module'];

function renderAuc() {
  const dis = sel.auc === 'disease';
  document.getElementById('aucBody').innerHTML =
    histogram(dis ? D.calib.diseaseAuc : D.calib.familyAuc, {
      mean: dis ? 0.8230 : 0.8009, marker: dis ? 0.9365 : null, markerLabel: 'HER2+ 0.9365',
      aria: dis ? 'per-disease AUC' : 'per-family AUC' })
    + legend([['var(--chart-3)','at or above chance'],['var(--chart-1)','below chance — 8, and we show them']])
    + (dis
      ? `<div class="warnbox" style="margin-top:10px"><b>The <code>level</code> filter is load-bearing.</b>
         This dataset holds two populations — 670 <code>disease</code> rows and 443 <code>split_key</code>
         rows. Filtered: <b>0.8230</b>. Unfiltered: <b>0.8157</b>. A view missing it is off by 73 basis
         points and looks perfectly fine.</div>`
      : `<div class="warnbox" style="margin-top:10px">Two of the 505 families carry a literal
         <code>NaN</code> — zero positives, so AUC is undefined. The documented 0.8009 is a NaN-skipping
         mean over <b>503</b> families presented as 505.</div>`);
}

function renderFamily() {
  const key = document.getElementById('famSel').value;
  const f = D.families.find(x => x[0] === key);
  document.getElementById('famNote').textContent =
    `${f[2]} diseases · family AUC ${f[3].toFixed(4)}` + (f[4] ? '' : ' · panel metrics not yet materialised');
  document.getElementById('famBody').innerHTML = f[4]
    ? `<div class="tw"><table><thead><tr><th>Term</th><th class="n">Hop</th><th class="n">Pool</th>
        <th class="n">Known</th><th class="n">AUC</th><th class="n">95% CI</th><th class="n">Hits@50</th><th></th></tr></thead>
      <tbody>${D.panel.map(p => `<tr class="${p[0] === 'HER2+' ? 'hl' : ''}">
        <td>${esc(p[1])}</td><td class="n">${p[2]}</td><td class="n">${fmt(p[3])}</td><td class="n">${p[4]}</td>
        <td class="n">${p[5].toFixed(4)}</td><td class="n">${p[6].toFixed(3)}–${p[7].toFixed(3)}</td>
        <td class="n">${p[8]}</td><td>${p[10] ? '' : '<span class="b b-liab">AUC UNPINNED</span>'}</td></tr>`).join('')}
      </tbody></table></div>`
    : `<div class="warnbox"><b>${esc(f[1])} is scored but has no panel table yet.</b>
        <code>compute_breast_panel.py</code> carries a hardcoded <code>PANEL</code> dict of disease
        indices. Replacing it with a join on <code>disease_family_id</code> (recipe D) unlocks this
        family and the fifteen others — including the two non-oncology ones, which are how this deck
        answers <i>“does it only work on cancer?”</i></div>`;
  renderTree(f[4]);
}

function renderTree(real) {
  if (!real) { document.getElementById('tree').innerHTML =
    `<div style="font-size:12px;color:var(--muted-foreground);padding:6px">Select breast cancer to see the tree.</div>`; return; }
  document.getElementById('tree').innerHTML = D.panel
    .slice().sort((a, b) => a[2] - b[2] || b[4] - a[4])
    .map(p => `<div class="${p[2] === 0 ? 'anchor' : ''} ${p[0] === 'HER2+' ? 'sel' : ''} ${p[10] ? '' : 'inelig'}"
        style="padding-left:${6 + p[2] * 16}px">
        <span>${p[2] ? '└ ' : ''}${esc(p[1])}</span><span class="dn">${p[4]}</span></div>`).join('');
}

function renderOverlap() {
  document.getElementById('ovBody').innerHTML = matrix(SHORTS, D.overlap, sel.ov);
}
function renderGrid() {
  document.getElementById('gridBody').innerHTML = geneGrid(D.grid, CLIN);
}

function rowsFor() {
  let r = D.her2;
  if (sel.filter === 'novel') r = r.filter(x => x[2]);
  if (sel.filter === 'trial') r = r.filter(x => x[4]);
  return r;
}
function renderTable() {
  const rows = rowsFor();
  document.getElementById('tblBody').innerHTML = rows.map(r => {
    const dead = sel.liab && r[5];
    return `<tr class="click ${r[1] === sel.gene ? 'sel' : ''} ${dead ? 'dead' : ''}" data-g="${r[1]}">
      <td class="n">${r[0]}</td><td class="gene">${r[1]}</td><td>${esc(r[6])}</td><td>
      ${r[2] ? '<span class="b b-novel">NOVEL</span>' : '<span class="b b-known">known</span>'}
      ${r[3] ? '<span class="b b-appr">APPROVED</span>' : ''}
      ${r[4] ? '<span class="b b-trial">trial</span>' : ''}
      ${r[5] ? '<span class="b b-liab">liability</span>' : ''}</td></tr>`;
  }).join('');
  const killed = rows.filter(r => r[5]).length;
  document.getElementById('liabTog').classList.toggle('on', sel.liab);
  document.getElementById('liabNote').innerHTML = sel.liab
    ? `<div class="no" style="margin-top:10px"><div class="no-t">What that filter just did</div>
        <b>${killed} of ${rows.length} deleted — including ERBB2 at #14</b>, the target of this disease’s
        standard-of-care antibody. Flagged genes carry <b>4.62×</b> enrichment among drug-validated
        targets, because liabilities are discovered <i>by</i> drugging something. The flag marks the
        best-studied targets, which is why it is a badge here and never a filter in production.</div>`
    : `<div class="say" style="margin-top:10px">Liability flags and drug badges are shown but
        <b>cannot be filtered on in production</b> — the drug badges are the ground truth the discovery
        result is measured against. The toggle above exists to demonstrate <i>why</i>, once.</div>`;
  Array.prototype.forEach.call(document.querySelectorAll('#tblBody tr[data-g]'), tr =>
    tr.onclick = () => { sel.gene = tr.dataset.g; renderTable(); renderDrawer(); renderGraph(); });
}

function renderDrawer() {
  const g = D.her2.find(x => x[1] === sel.gene) || D.her2[8];
  const pct = FEAT[g[1]] || [88, 84, 80, 71, 60];
  document.getElementById('drawerBody').innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="gene" style="font-size:17px">${g[1]}</span>
      <span>${g[2] ? '<span class="b b-novel">NOVEL</span>' : '<span class="b b-known">known</span>'}
        ${g[3] ? '<span class="b b-appr">APPROVED</span>' : ''}${g[5] ? '<span class="b b-liab">liability</span>' : ''}</span></div>
    <div style="font-size:11.5px;color:var(--muted-foreground);margin-bottom:9px">
      rank #${g[0]} of 12,272 · ${esc(g[6])} · node_index ${D.geneIdx[g[1]]}</div>
    ${FEATL.map((l, i) => `<div style="margin-bottom:7px">
      <div style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(l)}</span>
        <span class="num">${pct[i]} pct</span></div>
      <div style="height:5px;background:var(--muted);border-radius:3px;margin-top:2px">
        <i style="display:block;height:100%;width:${pct[i]}%;background:var(--chart-3);border-radius:3px"></i></div></div>`).join('')}
    <div style="font-size:11px;color:var(--muted-foreground);margin-top:8px">
      “Higher than ${pct[0]}% of candidates <b>for this disease</b>” — not a global percentile.</div>`;
}

function renderGraph() {
  const g = D.her2.find(x => x[1] === sel.gene) || D.her2[8];
  const idx = D.geneIdx[g[1]];
  document.getElementById('graphBody').innerHTML =
    `<pre><span class="cmt">// Why ${g[1]}? Interaction evidence to genes already annotated
// for HER2-positive breast carcinoma.</span>
MATCH (D:disease {node_index: 48537})
MATCH (g:protein {node_index: ${idx}})
MATCH (g)-[ppi:protein_protein]-(m:protein)-[assoc:disease_protein]-(D)
WHERE m.node_index &lt;&gt; g.node_index
RETURN g, ppi, m, assoc, D LIMIT 300</pre>
    <div class="filters" style="margin-top:10px">
      <button class="ctl">Open in Graph Explorer</button>
      <button class="ctl">Copy query</button>
      <span style="font-size:11.5px;color:var(--muted-foreground)">follows the selected row</span></div>
    <div class="warnbox" style="margin-top:10px">Traversal is <b>undirected</b>; relationship variables must
      be <b>bound and returned</b> or the canvas shows floating nodes; the engine’s label for genes is
      <code>protein</code>. Indices are snapshot-specific and generated live from the current ranking.</div>`;
}

/* ==========================================================================
   Shell
   ========================================================================== */
const nav = document.getElementById('nav'), navOut = document.getElementById('navOut'), main = document.getElementById('main');
const ALL = ACTS.concat([TALK]);
nav.innerHTML = ACTS.map(a => `<button type="button" data-id="${a.id}"><span class="k">${a.n}</span><span class="t">${esc(a.title)}</span></button>`).join('');
navOut.innerHTML = `<button type="button" data-id="${TALK.id}"><span class="k">◇</span><span class="t">${esc(TALK.title)}</span></button>`;
main.innerHTML = ALL.map(a => `<div class="view" id="v-${a.id}" hidden>
    <header class="act-head">
      <div class="act-eyebrow">${a.n ? `Act ${a.n} of 4 · ${esc(a.title)}` : 'Demo preparation · not shipped in the app'}</div>
      <h1 class="act-q">${a.q}</h1><p class="act-lede">${a.lede}</p></header>
    <div class="wrap"><div class="grid">${a.render()}</div></div></div>`).join('');

function show(id) {
  ALL.forEach(a => {
    document.getElementById('v-' + a.id).hidden = a.id !== id;
    const b = document.querySelector(`[data-id="${a.id}"]`);
    if (a.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (id === 'calibration') { renderAuc(); wireBeeswarm(document.getElementById('v-calibration'), BEE.hover, 700); }
  if (id === 'therapeutic-area') { renderFamily(); renderOverlap(); renderGrid(); }
  if (id === 'shortlist') { renderTable(); renderDrawer(); renderGraph(); }
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (b) return show(b.dataset.id);
  const t = e.target.closest('#aucTabs button');
  if (t) { sel.auc = t.dataset.t;
    document.querySelectorAll('#aucTabs button').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    return renderAuc(); }
  const o = e.target.closest('#ovSeg button');
  if (o) { sel.ov = o.dataset.m;
    document.querySelectorAll('#ovSeg button').forEach(x => x.setAttribute('aria-selected', String(x === o)));
    return renderOverlap(); }
  const f = e.target.closest('#tblFilters button[data-f]');
  if (f) { sel.filter = f.dataset.f;
    document.querySelectorAll('#tblFilters button[data-f]').forEach(x => x.setAttribute('aria-selected', String(x === f)));
    return renderTable(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'famSel') { renderFamily(); renderOverlap(); renderGrid(); }
  if (e.target.id === 'liabChk') { sel.liab = e.target.checked; renderTable(); }
});
show(ALL.some(a => a.id === location.hash.slice(1)) ? location.hash.slice(1) : ACTS[0].id);
</script>
