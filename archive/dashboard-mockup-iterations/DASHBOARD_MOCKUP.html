/* ==========================================================================
   SVG chart helpers. Hand-built because the Vue app uses ECharts and this
   mockup must not depend on a CDN. Shapes match what ECharts will render.
   ========================================================================== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');

/** Horizontal bars. rows = [label, value, colorVar?] */
function hbars(rows, opts = {}) {
  const rh = opts.rowH || 20, gap = 4, lw = opts.labelW || 168, vw = 62;
  const h = rows.length * (rh + gap), max = Math.max(...rows.map(r => r[1]));
  const bw = Math.max(120, (opts.width || 640) - lw - vw);
  let s = `<svg viewBox="0 0 ${lw + bw + vw} ${h}" role="img" aria-label="${esc(opts.aria || 'bar chart')}">`;
  rows.forEach((r, i) => {
    const y = i * (rh + gap), w = Math.max(1.5, (r[1] / max) * bw);
    const col = r[2] || 'var(--chart-3)';
    s += `<text class="lab" x="${lw - 8}" y="${y + rh / 2 + 4}" font-size="11" text-anchor="end">${esc(r[0])}</text>`;
    s += `<rect x="${lw}" y="${y + 2}" width="${w}" height="${rh - 4}" rx="2.5" fill="${col}"/>`;
    s += `<text x="${lw + bw + vw - 2}" y="${y + rh / 2 + 4}" font-size="10.5" text-anchor="end">${fmt(r[1])}</text>`;
  });
  return s + '</svg>';
}

/** Histogram over 20 bins spanning [0,1]. */
function histogram(bins, opts = {}) {
  const W = 640, H = opts.height || 190, pl = 34, pb = 26, pt = 10, pr = 8;
  const iw = W - pl - pr, ih = H - pb - pt, max = Math.max(...bins);
  const bw = iw / bins.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || 'histogram')}">`;
  for (let g = 0; g <= 4; g++) {
    const y = pt + ih - (ih * g / 4);
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>`;
    s += `<text x="${pl - 6}" y="${y + 3.5}" font-size="9.5" text-anchor="end">${Math.round(max * g / 4)}</text>`;
  }
  /* Bins below 0.5 are worse than chance — a real distinction, so it gets a color. */
  bins.forEach((c, i) => {
    const bh = max ? (c / max) * ih : 0;
    const mid = (i + 0.5) / bins.length;
    const col = mid < 0.5 ? 'var(--chart-1)' : 'var(--chart-3)';
    if (c > 0) s += `<rect x="${pl + i * bw + 1}" y="${pt + ih - bh}" width="${bw - 2}" height="${bh}" rx="1.5" fill="${col}"/>`;
  });
  const chance = pl + 0.5 * iw;
  s += `<line x1="${chance}" x2="${chance}" y1="${pt}" y2="${pt + ih}" stroke="var(--muted-foreground)" stroke-dasharray="2 3"/>`;
  s += `<text x="${chance - 4}" y="${pt + 11}" font-size="9" text-anchor="end">chance</text>`;
  if (opts.mean != null) {
    const x = pl + opts.mean * iw;
    s += `<line x1="${x}" x2="${x}" y1="${pt}" y2="${pt + ih}" stroke="var(--destructive)" stroke-width="1.5"/>`;
    s += `<text x="${x + 4}" y="${pt + 11}" font-size="10" fill="var(--destructive)">macro ${opts.mean.toFixed(4)}</text>`;
  }
  if (opts.marker != null) {
    const x = pl + opts.marker * iw;
    s += `<path d="M${x} ${pt + ih} l-4 8 h8 z" fill="var(--primary)"/>`;
    s += `<text x="${x}" y="${pt + ih + 22}" font-size="10" text-anchor="middle" fill="var(--primary)">${esc(opts.markerLabel || '')}</text>`;
  }
  s += `<line x1="${pl}" x2="${W - pr}" y1="${pt + ih}" y2="${pt + ih}" stroke="var(--border)"/>`;
  [0, .25, .5, .75, 1].forEach(t => {
    s += `<text x="${pl + t * iw}" y="${H - 6}" font-size="9.5" text-anchor="middle">${t.toFixed(2)}</text>`;
  });
  return s + '</svg>';
}

/** Single horizontal box plot with whiskers. */
function boxplot(b) {
  const W = 640, H = 96, pl = 12, pr = 12, y = 34, bh = 26;
  const lo = 0, hi = Math.ceil(b.max / 10) * 10, iw = W - pl - pr;
  const X = v => pl + ((v - lo) / (hi - lo)) * iw;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="rank enrichment distribution">`;
  s += `<line x1="${X(b.min)}" x2="${X(b.max)}" y1="${y + bh / 2}" y2="${y + bh / 2}" stroke="var(--chart-3)" stroke-width="1.5"/>`;
  [b.min, b.max].forEach(v => s += `<line x1="${X(v)}" x2="${X(v)}" y1="${y + 5}" y2="${y + bh - 5}" stroke="var(--chart-3)" stroke-width="1.5"/>`);
  s += `<rect x="${X(b.q1)}" y="${y}" width="${X(b.q3) - X(b.q1)}" height="${bh}" rx="3"
         fill="color-mix(in oklab, var(--chart-3) 22%, transparent)" stroke="var(--chart-3)"/>`;
  s += `<line x1="${X(b.med)}" x2="${X(b.med)}" y1="${y - 3}" y2="${y + bh + 3}" stroke="var(--chart-3)" stroke-width="2.5"/>`;
  s += `<text x="${X(b.med)}" y="${y - 8}" font-size="11" text-anchor="middle" fill="var(--chart-3)">median ${b.med.toFixed(1)}×</text>`;
  [[b.min, 'min'], [b.q1, 'Q1 ' + b.q1.toFixed(1)], [b.q3, 'Q3 ' + b.q3.toFixed(1)], [b.max, 'max ' + b.max.toFixed(1)]]
    .forEach(([v, l]) => s += `<text x="${X(v)}" y="${y + bh + 20}" font-size="9.5" text-anchor="middle">${esc(l)}</text>`);
  return s + '</svg>';
}

/** Donut. rows = [label, value] */
function donut(rows) {
  const R = 62, r = 38, cx = 80, cy = 80;
  const total = rows.reduce((a, b) => a + b[1], 0);
  const cols = ['var(--chart-3)', 'var(--chart-1)', 'var(--chart-2)', 'var(--chart-4)'];
  let a0 = -Math.PI / 2, s = `<svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="composition">`;
  rows.forEach((row, i) => {
    const a1 = a0 + (row[1] / total) * Math.PI * 2;
    const big = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)} ${(cy + rad * Math.sin(ang)).toFixed(2)}`;
    s += `<path d="M ${p(R, a0)} A ${R} ${R} 0 ${big} 1 ${p(R, a1)} L ${p(r, a1)} A ${r} ${r} 0 ${big} 0 ${p(r, a0)} Z" fill="${cols[i % 4]}"/>`;
    a0 = a1;
  });
  s += `<text x="${cx}" y="${cy - 2}" font-size="15" text-anchor="middle" fill="var(--foreground)">${fmt(total)}</text>`;
  s += `<text x="${cx}" y="${cy + 13}" font-size="9" text-anchor="middle">edges</text>`;
  return s + '</svg>';
}

/** Grouped two-series bars around a 1.0 = no-effect line.
 *  Scale is capped so one outlier (ion channel at 11.89x) cannot compress the
 *  comparison the card is actually about. Capped bars get a notch and keep
 *  their true value in the label — clipped, never silently rescaled. */
function diverge(rows, cap = 4) {
  const W = 640, rh = 34, pl = 158, pr = 52;
  const H = rows.length * rh + 24, iw = W - pl - pr;
  const X = v => (Math.min(v, cap) / cap) * iw;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="association versus drug enrichment by target class">`;
  const one = pl + X(1);
  s += `<line x1="${one}" x2="${one}" y1="8" y2="${H - 16}" stroke="var(--muted-foreground)" stroke-dasharray="3 3"/>`;
  s += `<text x="${one}" y="${H - 4}" font-size="9.5" text-anchor="middle">1.0× = no effect</text>`;
  rows.forEach((r, i) => {
    const y = 8 + i * rh;
    s += `<text class="lab" x="${pl - 8}" y="${y + 15}" font-size="11" text-anchor="end">${esc(r[0])}</text>`;
    [[r[1], 'var(--chart-1)', 0], [r[2], 'var(--chart-3)', 12]].forEach(([v, c, dy]) => {
      const w = Math.max(1.5, X(v)), yy = y + dy + 1, over = v > cap;
      s += over
        ? `<path d="M${pl} ${yy} H${pl + w - 6} l6 5 -6 5 H${pl} Z" fill="${c}"/>`
        : `<rect x="${pl}" y="${yy}" width="${w}" height="10" rx="2" fill="${c}"/>`;
      s += `<text x="${pl + w + 5}" y="${yy + 8.5}" font-size="9.5"${over ? ' font-weight="600"' : ''}>${v.toFixed(2)}×</text>`;
    });
  });
  return s + '</svg>';
}

/** Two-series line over K. */
function lines(o) {
  const W = 640, H = 200, pl = 34, pb = 28, pt = 12, pr = 40;
  const iw = W - pl - pr, ih = H - pb - pt;
  const max = Math.ceil(Math.max(...o.approved) / 5) * 5;
  const X = i => pl + (i / (o.k.length - 1)) * iw, Y = v => pt + ih - (v / max) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="discovery lift against K by ground truth">`;
  for (let g = 0; g <= 4; g++) {
    const y = pt + ih - ih * g / 4;
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3"/>`;
    s += `<text x="${pl - 6}" y="${y + 3.5}" font-size="9.5" text-anchor="end">${Math.round(max * g / 4)}×</text>`;
  }
  [['approved', 'var(--chart-3)'], ['trials', 'var(--chart-1)']].forEach(([key, col]) => {
    const pts = o[key].map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
    o[key].forEach((v, i) => s += `<circle cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="${col}"/>`);
    const last = o[key].length - 1;
    s += `<text x="${X(last) + 6}" y="${Y(o[key][last]) + 3.5}" font-size="10" fill="${col}">${o[key][last].toFixed(1)}×</text>`;
  });
  s += `<text x="${X(0) + 6}" y="${Y(o.approved[0]) - 8}" font-size="10" fill="var(--chart-3)">16.9×</text>`;
  o.k.forEach((k, i) => s += `<text x="${X(i)}" y="${H - 8}" font-size="9.5" text-anchor="middle">top ${k}</text>`);
  return s + '</svg>';
}

/** Scatter of two 0..1 axes. pts = [x, y, label, flag] */
function scatter(pts, o) {
  const W = 560, H = 300, pl = 42, pb = 40, pt = 12, pr = 12;
  const iw = W - pl - pr, ih = H - pb - pt;
  const X = v => pl + (v - o.x0) / (o.x1 - o.x0) * iw, Y = v => pt + ih - (v - o.y0) / (o.y1 - o.y0) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">`;
  s += `<rect x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="none" stroke="var(--border)"/>`;
  if (o.vline != null) {
    s += `<line x1="${X(o.vline)}" x2="${X(o.vline)}" y1="${pt}" y2="${pt + ih}" stroke="var(--destructive)" stroke-dasharray="4 3"/>`;
    s += `<text x="${X(o.vline) + 5}" y="${pt + 12}" font-size="9.5" fill="var(--destructive)">${esc(o.vlabel)}</text>`;
  }
  pts.forEach(p => {
    const col = p[3] === 'hard' ? 'var(--destructive)' : p[3] === 'lead' ? 'var(--primary)' : 'var(--chart-2)';
    s += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${p[3] ? 6 : 4.5}" fill="${col}"
           fill-opacity="${p[3] ? 1 : .6}" stroke="var(--card)"/>`;
    if (p[2]) s += `<text class="lab" x="${X(p[0]) + 9}" y="${Y(p[1]) + 3.5}" font-size="10" fill="${col}">${esc(p[2])}</text>`;
  });
  s += `<text class="lab" x="${pl + iw / 2}" y="${H - 6}" font-size="10.5" text-anchor="middle">${esc(o.xl)}</text>`;
  s += `<text class="lab" x="12" y="${pt + ih / 2}" font-size="10.5" text-anchor="middle"
         transform="rotate(-90 12 ${pt + ih / 2})">${esc(o.yl)}</text>`;
  return s + '</svg>';
}

/* ==========================================================================
   Card + view scaffolding
   ========================================================================== */
function card(o) {
  const chips = (o.chips || []).map(c =>
    `<span class="chip chip-${c[0]}">${esc(c[1])}</span>`).join('');
  return `<section class="card ${o.span || ''}">
    <div class="card-h">
      <div><div class="card-t">${o.title}</div>${o.desc ? `<div class="card-d">${o.desc}</div>` : ''}</div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${chips}</div>
    </div>
    <div class="card-b">${o.body}</div>
    ${o.src ? `<div class="card-f"><span>src</span><span>${esc(o.src)}</span></div>` : ''}
  </section>`;
}
const stat = (l, v, c) => `<div class="stat"><div class="stat-l">${l}</div><div class="stat-v">${v}</div>${c ? `<div class="stat-c">${c}</div>` : ''}</div>`;
const legend = items => `<div class="lgd">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
const never = items => `<div class="no"><div class="no-t">Must not appear</div>${items}</div>`;

   ========================================================================== */
const nav = document.getElementById('nav'), main = document.getElementById('main');

nav.innerHTML = ACTS.map(a =>
  `<button type="button" data-id="${a.id}"><span class="k">${a.n}</span><span class="t">${esc(a.title)}</span></button>`
).join('');

main.innerHTML = ACTS.map(a => `
  <div class="view" id="v-${a.id}" hidden>
    <header class="act-head">
      <div class="act-eyebrow">Act ${a.n} of 6 &middot; ${esc(a.title)}</div>
      <h1 class="act-q">${a.q}</h1>
      <p class="act-lede">${a.lede}</p>
    </header>
    <div class="wrap"><div class="grid">${a.render()}</div></div>
  </div>`).join('');

function show(id) {
  ACTS.forEach(a => {
    document.getElementById('v-' + a.id).hidden = a.id !== id;
    const b = nav.querySelector(`[data-id="${a.id}"]`);
    if (a.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  window.scrollTo({ top: 0, behavior: 'instant' });
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
}
nav.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (b) show(b.dataset.id);
});
show(ACTS.some(a => a.id === location.hash.slice(1)) ? location.hash.slice(1) : ACTS[0].id);
</script>
